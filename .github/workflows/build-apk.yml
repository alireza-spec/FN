name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web assets
        run: |
          mkdir -p www/icons
          cp index.html manifest.json sw.js sw44.js www/
          cp v44-js-*.js v44-css-*.css www/
          cp icons/icon-192.png icons/icon-512.png www/icons/
          if [ -d snapshot ]; then cp -r snapshot www/snapshot; ls www/snapshot; fi
          ls www
          test -f www/index.html

      - name: Bundle fonts for APK
        run: |
          python3 - << 'PY'
          import re, os, urllib.request, urllib.parse, pathlib
          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
              return urllib.request.urlopen(req, timeout=60).read().decode('utf-8', errors='replace')
          def bundle(css_url, out_dir, out_css):
              css = fetch(css_url)
              tokens = sorted(set(re.findall(r"url\(([^)]+)\)", css)))
              ok = 0
              for tok in tokens:
                  t = tok.strip().strip('\'"')
                  if t.startswith('data:') or t.startswith('http'):
                      continue
                  name = t.split('/')[-1].split('?')[0].split('#')[0]
                  if not name:
                      continue
                  src = urllib.parse.urljoin(css_url, t)
                  try:
                      req = urllib.request.Request(src, headers={'User-Agent': 'Mozilla/5.0'})
                      data = urllib.request.urlopen(req, timeout=60).read()
                      open(os.path.join('www', out_dir, name), 'wb').write(data)
                      css = css.replace(tok, out_dir + '/' + name)
                      ok += 1
                  except Exception as e:
                      print('font download failed:', src, e)
              if ok:
                  open(out_css, 'w', encoding='utf-8').write(css)
              return ok
          os.makedirs('www/fonts', exist_ok=True)
          os.makedirs('www/webfonts', exist_ok=True)
          n1 = bundle('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css', 'fonts', 'www/vazirmatn.css')
          n2 = bundle('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css', 'webfonts', 'www/fontawesome.css')
          print('bundled fonts:', n1, n2)
          idx = pathlib.Path('www/index.html').read_text(encoding='utf-8')
          if n1 and n2 and os.path.getsize('www/vazirmatn.css') > 0 and os.path.getsize('www/fontawesome.css') > 0:
              idx = idx.replace('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css', 'vazirmatn.css')
              idx = idx.replace('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css', 'fontawesome.css')
              pathlib.Path('www/index.html').write_text(idx, encoding='utf-8')
              print('index.html rewritten to local fonts')
          else:
              print('font bundle incomplete; keeping CDN links')
              raise SystemExit('font bundle failed: 0 fonts bundled')
          PY
          ls www/fonts www/webfonts 2>/dev/null | head -25
          sed -i 's|href="fonts/vazirmatn.css"|href="vazirmatn.css"|g; s|href="fonts/fontawesome.css"|href="fontawesome.css"|g' www/index.html

      - name: Init Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.familynight.app",
            "appName": "Family Night",
            "webDir": "www",
            "server": {
              "androidScheme": "https",
              "cleartext": true
            },
            "android": {
              "allowMixedContent": true
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Set APK version and icon
        run: |
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png || true
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-$d/ic_launcher.png 2>/dev/null || true
          cp www/icons/icon-512.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png 2>/dev/null || true
          done
          python3 - << 'PY'
          import re
          p = 'android/app/build.gradle'
          s = open(p).read()
          s = re.sub(r'versionCode \d+', 'versionCode 4420', s)
          s = re.sub(r'versionName "[^"]*"', 'versionName "44.0.20"', s)
          open(p, 'w').write(s)
          print('versionCode 4420' in s, 'versionName "44.0.20"' in s)
          PY

      - name: Build debug APK
        run: |
          cd android && ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FamilyNight-v44.0.20.apk
          ls -lh FamilyNight-v44.0.20.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FamilyNight-v44.0.20
          path: FamilyNight-v44.0.20.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v44.0.20
          name: Family Night v44.0.20 (APK)
          body: |
            Family Night Android APK, built from the web app in this repo (v44.0.20).
            No-VPN mode: when the Worker host is unreachable, Home renders from an hourly
            snapshot bundled in the APK (rows, hero, posters). Default language is English.
            v44.0.20 highlights: player popups blocked (sandboxed player iframe), sidebar
            handle rides with the sidebar, prev/next server buttons in the sidebar,
            detail loader never sticks (10s failsafe), watchlist/favorites state fixed.
            Install by sideloading: allow "Install unknown apps" for your browser, then open the APK.
            This is a debug-signed APK for direct installation. It is not a Play Store release build.
          files: FamilyNight-v44.0.20.apk
