name: FN home snapshot

# Hourly snapshot of the real Home screen (all rows + hero) so the app can
# render Home from Pages/jsdelivr when the Worker host is unreachable
# (filtered network). The runner loads the real app, scrolls every row,
# scrapes what the user would actually see, and commits JSON + images.
# No secrets needed: the runner reaches the Worker, the Worker calls TMDB.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fn-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm i playwright
          npx playwright install --with-deps chromium
      - name: Capture snapshot and commit
        run: |
          python3 -m http.server 8000 >/tmp/http.log 2>&1 &
          SRV=$!
          for i in $(seq 1 20); do curl -sf http://localhost:8000/ >/dev/null && break; sleep 1; done
          cat > /tmp/snap.cjs << 'SNAPEOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');
          const WORKER_IMG = 'https://family-night-api.alirezadoe8.workers.dev/img';
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            await page.goto('http://localhost:8000/', { waitUntil: 'domcontentloaded', timeout: 60000 });
            await page.waitForSelector('#hero-carousel .slide', { timeout: 60000 });
            const sectionIds = await page.$$eval('.section .row-scroll', els => els.map(e => e.id));
            console.log('sections found:', sectionIds.length);
            for (const id of sectionIds) {
              await page.evaluate((rid) => { const el = document.getElementById(rid); if (el) el.scrollIntoView({ block: 'center' }); }, id);
              try {
                await page.waitForFunction((rid) => {
                  const el = document.getElementById(rid);
                  return el && el.querySelectorAll('.card').length > 0;
                }, id, { timeout: 25000 });
              } catch (e) { console.log('row timeout (kept empty):', id); }
              await page.waitForTimeout(400);
            }
            await page.waitForTimeout(30000);
            const data = await page.evaluate(() => {
              const out = { hero: [], rows: {} };
              const pick = (m) => ({
                id: m.id, media_type: m.media_type || (m.title ? 'movie' : 'tv'),
                title: m.title, name: m.name, original_title: m.original_title, original_name: m.original_name,
                overview: m.overview, vote_average: m.vote_average, popularity: m.popularity,
                release_date: m.release_date, first_air_date: m.first_air_date,
                backdrop_path: m.backdrop_path, poster_path: m.poster_path, genre_ids: m.genre_ids || []
              });
              try {
                for (let i = 0; i < localStorage.length; i++) {
                  const k = localStorage.key(i);
                  if (k && k.indexOf('fn_cache_trending/all/day') === 0) {
                    const entry = JSON.parse(localStorage.getItem(k));
                    const res = (entry && entry.data && entry.data.results) || [];
                    out.hero = res.filter(m => m.backdrop_path).slice(0, 20).map(pick);
                    break;
                  }
                }
              } catch (e) {}
              const full = {};
              try {
                for (let i = 0; i < localStorage.length; i++) {
                  const k = localStorage.key(i);
                  if (k && k.indexOf('fn_cache_') === 0) {
                    const entry = JSON.parse(localStorage.getItem(k));
                    const res = (entry && entry.data && entry.data.results) || [];
                    for (const m of res) {
                      if (m && m.id && m.poster_path) {
                        const key = (m.media_type || '') + ':' + m.id;
                        if (!full[key]) full[key] = m;
                        if (!full['' + m.id]) full['' + m.id] = m;
                      }
                    }
                  }
                }
              } catch (e) {}
              document.querySelectorAll('.section .row-scroll').forEach(row => {
                const sid = row.id.replace(/^row-/, '');
                const items = [];
                row.querySelectorAll('.card').forEach(card => {
                  const oc = card.getAttribute('onclick') || '';
                  const mm = oc.match(/openDetail\((\d+),\s*'(\w+)'\)/);
                  const img = card.querySelector('img.poster');
                  const src = img ? (img.getAttribute('src') || '') : '';
                  const pm = src.match(/\/img\/w200(\/[^?#]+)/);
                  const titleEl = card.querySelector('.meta-title');
                  const rateEl = card.querySelector('.rate-badge');
                  const yearEl = card.querySelector('.meta-sub span');
                  const id = mm ? parseInt(mm[1], 10) : 0;
                  const type = mm ? mm[2] : 'movie';
                  const f = full[type + ':' + id] || full['' + id];
                  if (f) items.push(pick(f));
                  else if (pm) items.push({
                    id: id, media_type: type,
                    title: titleEl ? titleEl.textContent.trim() : '',
                    poster_path: pm[1],
                    vote_average: rateEl ? parseFloat(rateEl.textContent.replace(/[^0-9.]/g, '')) || null : null,
                    release_date: yearEl ? yearEl.textContent.trim() : ''
                  });
                });
                if (items.length) out.rows[sid] = items.slice(0, 20);
              });
              return out;
            });
            await browser.close();
            const posters = new Set();
            const backdrops = new Set();
            for (const sid of Object.keys(data.rows)) for (const m of data.rows[sid]) if (m.poster_path) posters.add(m.poster_path);
            for (const m of data.hero) if (m.backdrop_path) backdrops.add(m.backdrop_path);
            fs.mkdirSync('snapshot/img/w200', { recursive: true });
            fs.mkdirSync('snapshot/img/w780', { recursive: true });
            let imgOk = 0, imgFail = 0;
            async function dl(url, dest) {
              for (let a = 0; a < 2; a++) {
                try {
                  const r = await fetch(url);
                  if (r.ok) { fs.writeFileSync(dest, Buffer.from(await r.arrayBuffer())); imgOk++; return; }
                } catch (e) {}
              }
              imgFail++;
            }
            async function pool(jobs, n) {
              let i = 0;
              const workers = Array.from({ length: n }, async () => {
                while (i < jobs.length) { const j = jobs[i++]; await dl(j[0], j[1]); }
              });
              await Promise.all(workers);
            }
            const jobs = [];
            for (const p of posters) jobs.push([WORKER_IMG + '/w200' + p, 'snapshot/img/w200/' + path.basename(p)]);
            for (const p of backdrops) jobs.push([WORKER_IMG + '/w780' + p, 'snapshot/img/w780/' + path.basename(p)]);
            await pool(jobs, 10);
            const snap = { generated_at: new Date().toISOString(), lang: 'en-US', hero: data.hero, rows: data.rows };
            fs.writeFileSync('snapshot/home.json', JSON.stringify(snap));
            console.log('SNAPSHOT rows:', Object.keys(data.rows).length, 'hero:', data.hero.length, 'posters:', posters.size, 'backdrops:', backdrops.size, 'imgOk:', imgOk, 'imgFail:', imgFail);
          })().catch(e => { console.error('SNAPSHOT FAILED:', e); process.exit(1); });
          SNAPEOF
          node /tmp/snap.cjs
          kill $SRV || true
          git config user.email "fn-snapshot@users.noreply.github.com"
          git config user.name "FN snapshot"
          git add snapshot
          if git diff --cached --quiet; then
            echo "no snapshot changes"
          else
            git commit -m "FN: home snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
